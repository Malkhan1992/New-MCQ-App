<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Result</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Poppins:wght@400;700&display=swap');
        
        body {
            background: linear-gradient(to right, #a8d0e6, #dff6ff);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .result-container {
            background: linear-gradient(to right, #0a3d62, #1e5799);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.5);
            max-width: 900px;
            margin: 0 auto;
            color: white;
        }
        
        .result-header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #ffeb3b;
            padding-bottom: 20px;
        }
        
        .congrats {
            font-size: 28px;
            font-weight: bold;
            color: #ffeb3b;
            margin-bottom: 10px;
            font-family: 'Comic Neue', cursive;
        }
        
        .student-info {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        .student-name, .subject-name {
            font-size: 20px;
            margin: 10px 0;
        }
        
        .score-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        
        .score-item {
            flex: 1;
            min-width: 150px;
            margin: 10px;
        }
        
        .score-label {
            font-size: 16px;
            margin-bottom: 5px;
            color: #ffeb3b;
        }
        
        .score-value {
            font-size: 24px;
            font-weight: bold;
        }
        
        .performance {
            font-size: 28px;
            font-weight: bold;
            margin: 20px 0;
            text-align: center;
        }
        
        .excellent {
            color: #4CAF50;
        }
        
        .good {
            color: #2196F3;
        }
        
        .average {
            color: #FF9800;
        }
        
        .fail {
            color: #f44336;
        }
        
        .questions-table {
            width: 100%;
            border-collapse: collapse;
            margin: 30px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }
        
        .questions-table th, .questions-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .questions-table th {
            background: rgba(0, 0, 0, 0.2);
            color: #ffeb3b;
            font-weight: bold;
        }
        
        .questions-table tr:last-child td {
            border-bottom: none;
        }
        
        .correct {
            color: #4CAF50;
        }
        
        .incorrect {
            color: #f44336;
        }
        
        .time-cell {
            text-align: center;
        }
        
        .marks-cell {
            text-align: center;
            font-weight: bold;
        }
        
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .try-again {
            background-color: #ffeb3b;
            color: #333;
        }
        
        .try-again:hover {
            background-color: #ffd700;
        }
        
        .back-home {
            background-color: #80b3ff;
            color: #333;
        }
        
        .back-home:hover {
            background-color: #6090e0;
        }
        
        /* Success Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.7);
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from {opacity: 0}
            to {opacity: 1}
        }
        
        .modal-content {
            position: relative;
            background: linear-gradient(to right, #233a55, #2c5282);
            margin: 5% auto;
            padding: 25px;
            border-radius: 15px;
            width: 80%;
            max-width: 700px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            color: white;
            animation: slideIn 0.5s;
        }
        
        @keyframes slideIn {
            from {top: -300px; opacity: 0}
            to {top: 0; opacity: 1}
        }
        
        .modal-header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #ffeb3b;
            padding-bottom: 15px;
        }
        
        .modal-title {
            font-size: 28px;
            color: #ffeb3b;
            margin: 0;
            font-family: 'Comic Neue', cursive;
        }
        
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .close:hover {
            color: #fff;
        }
        
        .medal-display {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }
        
        .medal-img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-right: 20px;
            filter: drop-shadow(0 5px 15px rgba(255, 215, 0, 0.6));
        }
        
        .success-story {
            line-height: 1.6;
            margin: 20px 0;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
        }
        
        .success-story p {
            margin: 10px 0;
        }
        
        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        
        .view-certificate {
            background-color: #4CAF50;
            color: white;
        }
        
        .view-certificate:hover {
            background-color: #3d8b40;
        }
        
        .download-certificate {
            background-color: #2196F3;
            color: white;
        }
        
        .download-certificate:hover {
            background-color: #0b7dda;
        }
        
        /* Medal button */
        .view-medal {
            background-color: #9c27b0;
            color: white;
        }
        
        .view-medal:hover {
            background-color: #7b1fa2;
        }
        
        @media print {
            .buttons, .modal {
                display: none !important;
            }
            
            body {
                background: white;
            }
            
            .result-container {
                box-shadow: none;
                border: 1px solid #ccc;
            }
        }
        
        /* Certificate Preview in Modal */
        .certificate-preview {
            display: none;
            padding: 20px;
            background: #fff5e6;
            border: 10px solid #e6ccb3;
            margin: 20px 0;
            border-radius: 5px;
            color: #333;
            text-align: center;
        }
        
        .certificate-content {
            border: 2px solid #8B4513;
            padding: 20px;
        }
        
        .certificate-title {
            font-family: 'Dancing Script', cursive;
            font-size: 28px;
            color: #8B4513;
            margin-bottom: 15px;
        }
        
        .certificate-name {
            font-family: 'Dancing Script', cursive;
            font-size: 24px;
            font-weight: bold;
            color: #003366;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="result-container">
        <div class="result-header">
            <div class="congrats">Quiz Results</div>
        </div>
        
        <div class="student-info">
            <div class="student-name">Student: <span id="student-name">Student Name</span></div>
            <div class="subject-name">Subject: <span id="subject-name">Subject Name</span></div>
        </div>
        
        <div class="score-box">
            <div class="score-item">
                <div class="score-label">Total Score</div>
                <div class="score-value"><span id="total-marks">0</span>/<span id="max-marks">10</span></div>
            </div>
            <div class="score-item">
                <div class="score-label">Percentage</div>
                <div class="score-value"><span id="percentage">0</span>%</div>
            </div>
            <div class="score-item">
                <div class="score-label">Questions Attempted</div>
                <div class="score-value"><span id="questions-attempted">0</span>/<span id="total-questions">5</span></div>
            </div>
        </div>
        
        <div class="performance" id="performance">Performance: Average</div>
        
        <h3>Question Details</h3>
        <table class="questions-table">
            <thead>
                <tr>
                    <th>Q#</th>
                    <th>Question</th>
                    <th>Your Answer</th>
                    <th>Correct Answer</th>
                    <th>Time Spent</th>
                    <th>Marks</th>
                </tr>
            </thead>
            <tbody id="questions-details">
                <!-- Questions details will be inserted here -->
            </tbody>
        </table>
        
        <div class="buttons">
            <button class="try-again" id="try-again">Try Again</button>
            <button class="back-home" id="back-home">Back to Subjects</button>
            <button class="print-result" id="print-result" onclick="window.print()">Print Results</button>
            <button class="view-certificate" id="view-certificate" style="display: none;">View Certificate</button>
            <button class="download-certificate" id="download-certificate" style="display: none;">Download Certificate</button>
        </div>
    </div>

    <script>
        // Get logged in user and subject
        const loggedInUser = localStorage.getItem("loggedInUser");
        const selectedSubject = localStorage.getItem("selectedSubject");
        
        // Get quiz results from localStorage
        const quizResults = JSON.parse(localStorage.getItem("quizResults") || "{}");
        
        // Update student and subject info
        document.getElementById("student-name").textContent = loggedInUser || "Student";
        document.getElementById("subject-name").textContent = selectedSubject || "Quiz";
        
        // Update score information
        document.getElementById("total-marks").textContent = quizResults.totalMarks || 0;
        document.getElementById("max-marks").textContent = quizResults.maxPossibleMarks || 0;
        document.getElementById("percentage").textContent = Math.round(quizResults.percentage || 0);
        
        // Count attempted questions
        const questionsAttempted = quizResults.questionResults ? 
            quizResults.questionResults.filter(q => q.userAnswer !== "Not Answered").length : 0;
        
        document.getElementById("questions-attempted").textContent = questionsAttempted;
        document.getElementById("total-questions").textContent = quizResults.questionResults ? 
            quizResults.questionResults.length : 0;
        
        // Update performance comment with appropriate class
        const performanceElem = document.getElementById("performance");
        performanceElem.textContent = "Performance: " + (quizResults.performanceComment || "Not Available");
        
        // Add class based on performance
        if (quizResults.performanceComment) {
            performanceElem.classList.add(quizResults.performanceComment.toLowerCase());
        }
        
        // Populate questions table
        const questionsDetailsElem = document.getElementById("questions-details");
        
        if (quizResults.questionResults && quizResults.questionResults.length > 0) {
            quizResults.questionResults.forEach((result, index) => {
                const row = document.createElement("tr");
                
                // Question number
                const numCell = document.createElement("td");
                numCell.textContent = index + 1;
                row.appendChild(numCell);
                
                // Question text
                const questionCell = document.createElement("td");
                questionCell.textContent = result.question;
                row.appendChild(questionCell);
                
                // User answer
                const userAnswerCell = document.createElement("td");
                userAnswerCell.textContent = result.userAnswer;
                userAnswerCell.classList.add(result.isCorrect ? "correct" : "incorrect");
                row.appendChild(userAnswerCell);
                
                // Correct answer
                const correctAnswerCell = document.createElement("td");
                correctAnswerCell.textContent = result.correctAnswer;
                row.appendChild(correctAnswerCell);
                
                // Time spent
                const timeCell = document.createElement("td");
                timeCell.textContent = result.timeSpent + " sec";
                timeCell.className = "time-cell";
                row.appendChild(timeCell);
                
                // Marks
                const marksCell = document.createElement("td");
                marksCell.textContent = result.marks;
                marksCell.className = "marks-cell";
                marksCell.style.color = result.marks > 0 ? "#4CAF50" : "#f44336";
                row.appendChild(marksCell);
                
                questionsDetailsElem.appendChild(row);
            });
        } else {
            const row = document.createElement("tr");
            const cell = document.createElement("td");
            cell.setAttribute("colspan", "6");
            cell.textContent = "No question data available";
            cell.style.textAlign = "center";
            row.appendChild(cell);
            questionsDetailsElem.appendChild(row);
        }
        
        // Add event listeners
        document.getElementById("try-again").addEventListener("click", function() {
            window.location.href = "quiz.html";
        });
        
        document.getElementById("back-home").addEventListener("click", function() {
            window.location.href = "subjects.html";
        });
    
        // Remove success story and medal modal logic
        // Show certificate buttons if percentage >= 80
        const percentage = quizResults.percentage || 0;
        if (percentage >= 80) {
            document.getElementById("view-certificate").style.display = "inline-block";
            document.getElementById("download-certificate").style.display = "inline-block";
        }
        document.getElementById("view-certificate").onclick = function() {
            window.open('certificate.html', '_blank');
        };
        document.getElementById("download-certificate").onclick = function() {
            const win = window.open('certificate.html', '_blank');
            win.onload = function() {
                win.print();
            };
        };
    </script>
</body>
</html>
